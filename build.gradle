plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = "${minecraft_version}-${mod_version}"
group = mod_group_id

base {
    archivesName = 'couponcodes'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude('**/*.bbmodel')
    exclude('src/generated/**/.cache')
}

repositories {
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
    maven {
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me'
    }
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net'
    }
    maven {
        name = 'Curios'
        url = 'https://maven.theillusivec4.top'
    }
}

configurations {
    clientRuntimeMods {
        canBeConsumed = false
        canBeResolved = true
    }
    jeiRuntimeMod {
        canBeConsumed = false
        canBeResolved = true
    }
    reiRuntimeMod {
        canBeConsumed = false
        canBeResolved = true
        transitive = true
    }
}

tasks.register('syncClientRuntimeMods', Sync) {
    from configurations.clientRuntimeMods
    into layout.projectDirectory.dir('run/mods')
}

tasks.register('syncJeiRuntimeMods', Sync) {
    from configurations.clientRuntimeMods
    from configurations.jeiRuntimeMod
    into layout.projectDirectory.dir('run-jei/mods')
}

tasks.register('syncReiRuntimeMods', Sync) {
    from configurations.clientRuntimeMods
    from configurations.reiRuntimeMod
    into layout.projectDirectory.dir('run-rei/mods')
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            taskBefore tasks.named('syncClientRuntimeMods')
        }

        clientWithJEI {
            client()
            gameDirectory = file('run-jei')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            taskBefore tasks.named('syncJeiRuntimeMods')
        }

        clientWithREI {
            client()
            gameDirectory = file('run-rei')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            taskBefore tasks.named('syncReiRuntimeMods')
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll(
                    '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
            )
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    jeiRuntimeMod "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    compileOnly "me.shedaniel:RoughlyEnoughItems-api-neoforge:${rei_version}"
    compileOnly "me.shedaniel:RoughlyEnoughItems-default-plugin-neoforge:${rei_version}"
    compileOnly "net.fabricmc:fabric-loader:0.16.9"
    reiRuntimeMod "me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}"
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
    clientRuntimeMods "top.theillusivec4.curios:curios-neoforge:${curios_version}"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            jei_version_range      : jei_version_range,
            rei_version_range      : rei_version_range,
            curios_version_range   : curios_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]

    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
