name: Bug Report
description: Report a reproducible problem with Coupon Codes
title: "[Bug] "
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem with Coupon Codes.

        Please provide enough information for the issue to be reproduced and investigated.

  - type: input
    id: minecraft-version
    attributes:
      label: Minecraft Version
      description: Which Minecraft version are you using?
      placeholder: "Example: 1.21.1"
    validations:
      required: true

  - type: input
    id: mod-version
    attributes:
      label: Coupon Codes Version
      description: Which version of Coupon Codes are you using?
      placeholder: "Example: 1.0.0"
    validations:
      required: true

  - type: input
    id: loader
    attributes:
      label: Mod Loader
      description: Which mod loader and version are you using?
      placeholder: "Example: NeoForge 21.1.248"
    validations:
      required: true

  - type: dropdown
    id: issue-area
    attributes:
      label: Affected Feature
      description: Which part of Coupon Codes is affected?
      options:
        - Coupon Effects
        - Single-Use Coupons
        - Reusable Coupons
        - Timed Coupons
        - Coupon Pouches
        - Coupon Acquisition / Loot
        - Villager / Wandering Trader Trades
        - Commands
        - Configuration
        - Datapacks
        - JEI / REI Integration
        - Curios Integration
        - Rendering / Interface
        - Multiplayer Behavior
        - Other
        - Not sure
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem clearly.
      placeholder: Explain what went wrong.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
      placeholder: Explain what you expected.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide clear steps that can be used to reproduce the issue.
      placeholder: |
        1. Launch the game with ...
        2. Obtain or activate ...
        3. Perform ...
        4. The issue occurs.
    validations:
      required: true

  - type: textarea
    id: configuration
    attributes:
      label: Relevant Coupon Codes Configuration
      description: If the problem involves a coupon, pouch, command, datapack, configuration option, trade, loot source, or optional integration, describe it here.
      placeholder: |
        Example:
        - Coupon: Enchanting Coupon
        - Variant: Reusable
        - Configuration: Default
        - Integration: Curios installed

  - type: dropdown
    id: multiplayer
    attributes:
      label: Where Does the Issue Occur?
      description: Does the problem happen in singleplayer, multiplayer, or both?
      options:
        - Singleplayer only
        - Multiplayer only
        - Both singleplayer and multiplayer
        - Not sure
    validations:
      required: true

  - type: textarea
    id: other-mods
    attributes:
      label: Other Installed Mods
      description: List other mods that may be relevant. If the issue may be compatibility-related, provide the full mod list if possible.
      placeholder: |
        Example:
        - JEI 19.25.0.322
        - Curios 9.5.1
        - Example Mod 1.2.3

  - type: textarea
    id: logs
    attributes:
      label: Logs / Crash Report
      description: Attach or paste relevant logs or crash reports. Use a file attachment or code block for long logs.
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: Add screenshots, videos, server information, coupon details, configuration examples, or anything else that may help.

  - type: checkboxes
    id: checks
    attributes:
      label: Before Submitting
      options:
        - label: I searched existing issues and did not find the same problem.
          required: true
        - label: I am using a Coupon Codes version intended for my Minecraft version.
          required: true
        - label: I am using compatible versions of the required dependencies.
          required: true
        - label: I can reproduce this issue.
          required: true
